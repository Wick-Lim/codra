appId: com.codra.desktop
productName: CODRA
asar: true

directories:
  output: dist

files:
  - out/**/*
  - package.json

asarUnpack:
  - node_modules/node-pty/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/node-datachannel/**/*

extraResources:
  - from: dist/package-provenance.json
    to: package-provenance.json

afterPack: ../../scripts/ensure-packaged-helper-mode.mjs

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
